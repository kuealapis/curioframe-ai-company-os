name: Verify Virtual Office Build

on:
  push:
    branches: ["main"]
    paths:
      - "virtual-office-app/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/virtual-office-check.yml"

permissions:
  contents: read

concurrency:
  group: virtual-office-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate main application JavaScript
        run: node --check --input-type=module < app.js
      - name: Verify authenticated Mission Control integration
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const app=fs.readFileSync("app.js","utf8"); const html=fs.readFileSync("index.html","utf8"); const css=fs.readFileSync("styles.css","utf8"); for (const token of ["data-curioframe-office=\\"true\\"","src=\\"./virtual-office/index.html\\"","sendHQSnapshot(officeFrame)","event.source!==frame?.contentWindow"]) assert.ok(app.includes(token), "app.js missing "+token); assert.ok(html.includes("id=\\"virtual-hq-full-scene\\"")); assert.ok(css.includes("#virtual-hq-full-scene iframe[data-curioframe-office]")); console.log("Authenticated Mission Control iframe, snapshot bridge, and responsive frame styles verified.");'
      - name: Install free open-source dependencies
        run: npm install --prefix virtual-office-app --no-package-lock --no-audit --no-fund
      - name: Build Virtual Office
        run: npm run build --prefix virtual-office-app
      - name: Verify generated Pages entry point
        run: |
          test -s virtual-office/index.html
          test -n "$(find virtual-office/assets -type f | head -n 1)"
      - name: Install headless Chromium for browser verification
        run: npm exec --prefix virtual-office-app -- playwright install --with-deps chromium
      - name: Test desktop and Android-sized Virtual Office
        run: npm run test:smoke --prefix virtual-office-app
      - name: Clean dependencies from workspace
        if: always()
        run: rm -rf virtual-office-app/node_modules
      - name: Upload built Virtual Office preview
        uses: actions/upload-artifact@v4
        with:
          name: curioframe-virtual-office-preview
          path: virtual-office/
          if-no-files-found: error
          retention-days: 3
