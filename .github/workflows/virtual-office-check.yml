name: Verify Virtual Office Build

on:
  push:
    branches: ["main"]
    paths:
      - "virtual-office-app/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/virtual-office-check.yml"
  pull_request:
    paths:
      - "virtual-office-app/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/virtual-office-check.yml"

permissions:
  contents: read

concurrency:
  group: virtual-office-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate main application JavaScript
        run: node --check --input-type=module < app.js
      - name: Verify authenticated Mission Control integration
        run: |
          grep -Fq 'data-curioframe-office="true"' app.js
          grep -Fq 'src="./virtual-office/index.html"' app.js
          grep -Fq 'sendHQSnapshot(officeFrame)' app.js
          grep -Fq 'const frames=$("#virtual-hq-scene iframe[data-curioframe-office], #virtual-hq-full-scene iframe[data-curioframe-office]")' app.js
          grep -Fq 'candidate.contentWindow===event.source' app.js
          grep -Fq 'id="virtual-hq-full-scene"' index.html
          grep -Fq '#virtual-hq-full-scene iframe[data-curioframe-office]' styles.css
          echo "Authenticated Mission Control iframe, snapshot bridge, and responsive frame styles verified."
      - name: Verify Finance, Sales, and Owner app surfaces
        run: |
          grep -Fq 'data-page="finance"' index.html
          grep -Fq 'id="page-finance"' index.html
          grep -Fq 'id="finance-entry-form"' index.html
          grep -Fq 'data-page="sales"' index.html
          grep -Fq 'id="page-sales"' index.html
          grep -Fq 'id="sales-lead-form"' index.html
          grep -Fq 'from("finance_entries").select("*")' app.js
          grep -Fq 'from("client_leads").select("*")' app.js
          grep -Fq 'function renderFinance()' app.js
          grep -Fq 'function renderSales()' app.js
          ! grep -Fq 'supabase.auth.signUp' app.js
          echo "Finance, Sales, and Owner-only sign-in UI wiring verified."
      - name: Verify zero-cost and research evidence gates
        run: |
          grep -Fq 'HARD_ZERO_COST_GUARD' app.js
          grep -Fq 'verification_status:"retrieved_pending_human_review"' app.js
          grep -Fq 'decision:"BLOCKED_NOT_VERIFIED"' app.js
          grep -Fq 'source_status:asset.status' app.js
          grep -Fq 'T00:00:00+07:00' app.js
          grep -Fq 'String(x.description||"")' app.js
          echo "AI execution guard, human-review source status, blocked unverified intake, and Jakarta ledger date handling verified."
      - name: Install free open-source dependencies
        run: npm install --prefix virtual-office-app --no-package-lock --no-audit --no-fund
      - name: Build Virtual Office
        run: npm run build --prefix virtual-office-app
      - name: Verify generated Pages entry point
        run: |
          test -s virtual-office/index.html
          test -n "$(find virtual-office/assets -type f | head -n 1)"
      - name: Install headless Chromium for browser verification
        run: npm exec --prefix virtual-office-app -- playwright install --with-deps chromium
      - name: Test desktop and Android-sized Virtual Office
        run: npm run test:smoke --prefix virtual-office-app
      - name: Clean dependencies from workspace
        if: always()
        run: rm -rf virtual-office-app/node_modules
      - name: Upload built Virtual Office preview
        uses: actions/upload-artifact@v4
        with:
          name: curioframe-virtual-office-preview
          path: virtual-office/
          if-no-files-found: error
          retention-days: 3
