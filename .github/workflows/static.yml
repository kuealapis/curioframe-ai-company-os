# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  artifact-metadata: write
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-current"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application JavaScript
        run: node --check --input-type=module < app.js
      - name: Build React Three Fiber virtual office
        run: |
          npm install --prefix virtual-office-app --no-package-lock --no-audit --no-fund
          npm run build --prefix virtual-office-app
          rm -rf virtual-office-app/node_modules
      - name: Confirm this is the latest main revision
        id: freshness
        run: |
          latest=$(git ls-remote https://github.com/kuealapis/curioframe-ai-company-os.git refs/heads/main | awk '{print $1}')
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Pages deployment for $GITHUB_SHA; main is $latest."
          fi
      - name: Setup Pages
        if: steps.freshness.outputs.latest == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.freshness.outputs.latest == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Allow Pages artifact metadata to settle
        if: steps.freshness.outputs.latest == 'true'
        run: sleep 15
      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.latest == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
